name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Build errors summary
        if: failure()
        run: grep -nE "^e: |What went wrong|FAILED|error:" -A6 build.log | head -150 || true
      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --console=plain 2>&1 | tee test.log
      - name: Test errors summary
        if: always()
        run: grep -nE "^e: |What went wrong|FAILED|AssertionError|expected" -A6 test.log | head -150 || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alsalah-final-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
